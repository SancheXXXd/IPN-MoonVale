name: Verify release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Two isolated clean builds
        run: python3 scripts/verify_reproducible.py
      - name: Record commit and artifact checksums
        run: |
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat build/libs/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: IPNMoonVale-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS
            build/reports/release-verification.json
            build/reports/reproducibility.json
