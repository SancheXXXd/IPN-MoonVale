name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: IPNMoonVale
          path: build/libs/IPNMoonVale-fabric-2.3.8-mc26.3.jar
